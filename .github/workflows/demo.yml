name: Sentinel Drishti CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psutil pyyaml

      - name: Unit tests
        run: python tests/test_pipeline.py

      - name: Security tests
        run: python tests/test_security_deep.py

      - name: E2E tests
        run: python tests/test_e2e.py

      - name: Offline verify
        run: python tests/test_offline.py

      - name: Health check
        run: python scripts/health_check.py

      - name: Deployment check
        run: python scripts/deployment_check.py

      - name: Run all scenarios
        run: python scripts/run_scenario.py --all

      - name: Provider diagnostic
        run: python scripts/check_provider.py

  deployment-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psutil pyyaml

      - name: Smoke test - sentinel launcher responds
        run: |
          python sentinel.py --no-banner --health > /tmp/health.txt 2>&1 || true
          cat /tmp/health.txt

      - name: Smoke test - demo entry point
        run: |
          timeout 120 python sentinel.py --all-scenarios > /tmp/scenarios.txt 2>&1
          cat /tmp/scenarios.txt
          grep -q "SCENARIOS:" /tmp/scenarios.txt

      - name: Smoke test - offline verify
        run: |
          python sentinel.py --offline > /tmp/offline.txt 2>&1
          cat /tmp/offline.txt
          grep -q "OFFLINE VERIFICATION: PASS" /tmp/offline.txt

      - name: Deployment artifact log
        if: always()
        run: |
          echo "=== HEALTH ==="
          cat /tmp/health.txt || true
          echo "=== SCENARIOS ==="
          cat /tmp/scenarios.txt || true
          echo "=== OFFLINE ==="
          cat /tmp/offline.txt || true